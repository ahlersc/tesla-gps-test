<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old American V8 Simulator</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 650px;
        margin: auto;
        text-align: center;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #999;
        margin-bottom: 30px;
    }

    .panel {
        background: #1d1d1d;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 20px;
    }

    .speed {
        font-size: 56px;
        font-weight: bold;
        margin: 10px 0;
    }

    .unit {
        color: #aaa;
        font-size: 20px;
    }

    input[type="range"] {
        width: 100%;
        height: 45px;
        accent-color: #d32f2f;
        cursor: pointer;
    }

    .range-labels {
        display: flex;
        justify-content: space-between;
        color: #888;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 18px;
        font-size: 22px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background: #c62828;
        color: white;
        cursor: pointer;
    }

    button:active {
        background: #8e0000;
    }

    .data {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .data-box {
        background: #282828;
        border-radius: 12px;
        padding: 15px;
    }

    .data-label {
        color: #999;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .data-value {
        font-size: 28px;
        font-weight: bold;
    }

    .status {
        margin-top: 20px;
        color: #aaa;
    }

    .engine-light {
        width: 18px;
        height: 18px;
        display: inline-block;
        border-radius: 50%;
        background: #555;
        margin-right: 8px;
        vertical-align: middle;
    }

    .engine-light.running {
        background: #ff3b30;
        box-shadow: 0 0 15px #ff3b30;
    }

</style>
</head>

<body>

<div class="container">

    <h1>🇺🇸 Old American V8</h1>

    <div class="subtitle">
        GPS deaktiviert · Geschwindigkeit wird simuliert
    </div>


    <!-- GESCHWINDIGKEIT -->

    <div class="panel">

        <div class="unit">
            SIMULIERTE GESCHWINDIGKEIT
        </div>

        <div class="speed">
            <span id="speedValue">0</span>
            <span class="unit">km/h</span>
        </div>

        <input
            id="speedSlider"
            type="range"
            min="0"
            max="200"
            step="1"
            value="0"
        >

        <div class="range-labels">
            <span>0</span>
            <span>50</span>
            <span>100</span>
            <span>150</span>
            <span>200 km/h</span>
        </div>

    </div>


    <!-- MOTOR DATEN -->

    <div class="panel">

        <div class="data">

            <div class="data-box">

                <div class="data-label">
                    DREHZAHL
                </div>

                <div class="data-value">
                    <span id="rpmValue">800</span>
                    <span style="font-size:14px;color:#888;">
                        RPM
                    </span>
                </div>

            </div>


            <div class="data-box">

                <div class="data-label">
                    MOTORLAST
                </div>

                <div class="data-value">
                    <span id="loadValue">0</span>
                    <span style="font-size:14px;color:#888;">
                        %
                    </span>
                </div>

            </div>

        </div>

    </div>


    <!-- START -->

    <div class="panel">

        <button id="startButton">
            🔊 V8 STARTEN
        </button>

        <div class="status">

            <span
                id="engineLight"
                class="engine-light">
            </span>

            <span id="statusText">
                Motor aus
            </span>

        </div>

    </div>

</div>


<script>

////////////////////////////////////////////////////////////
// AUDIO VARIABLES
////////////////////////////////////////////////////////////

let audioContext = null;

let masterGain = null;
let engineGain = null;
let exhaustGain = null;
let rumbleGain = null;

let filter = null;

let oscillator1 = null;
let oscillator2 = null;
let oscillator3 = null;
let oscillator4 = null;

let engineRunning = false;


////////////////////////////////////////////////////////////
// ENGINE STATE
////////////////////////////////////////////////////////////

let targetRPM = 800;
let currentRPM = 800;

let targetLoad = 0;
let currentLoad = 0;

let simulatedSpeed = 0;


////////////////////////////////////////////////////////////
// START ENGINE
////////////////////////////////////////////////////////////

function startEngine() {

    if (engineRunning) {
        return;
    }


    ////////////////////////////////////////////////////////
    // AUDIO CONTEXT
    ////////////////////////////////////////////////////////

    audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();


    ////////////////////////////////////////////////////////
    // MASTER GAIN
    ////////////////////////////////////////////////////////

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0;

    masterGain.connect(
        audioContext.destination
    );


    ////////////////////////////////////////////////////////
    // ENGINE GAIN
    ////////////////////////////////////////////////////////

    engineGain =
        audioContext.createGain();

    engineGain.gain.value = 0.5;

    engineGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////
    // EXHAUST GAIN
    ////////////////////////////////////////////////////////

    exhaustGain =
        audioContext.createGain();

    exhaustGain.gain.value = 0.6;

    exhaustGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////
    // DEEP RUMBLE
    ////////////////////////////////////////////////////////

    rumbleGain =
        audioContext.createGain();

    rumbleGain.gain.value = 0.8;

    rumbleGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////

    filter =
        audioContext.createBiquadFilter();

    filter.type = "lowpass";

    filter.frequency.value = 500;

    filter.Q.value = 1.2;

    filter.connect(
        exhaustGain
    );


    ////////////////////////////////////////////////////////
    // OSCILLATORS
    ////////////////////////////////////////////////////////

    oscillator1 =
        createOscillator(
            "sawtooth",
            rumbleGain
        );

    oscillator2 =
        createOscillator(
            "sawtooth",
            filter
        );

    oscillator3 =
        createOscillator(
            "square",
            filter
        );

    oscillator4 =
        createOscillator(
            "triangle",
            engineGain
        );


    ////////////////////////////////////////////////////////
    // ENGINE START
    ////////////////////////////////////////////////////////

    engineRunning = true;

    document
        .getElementById("engineLight")
        .classList.add("running");

    document
        .getElementById("statusText")
        .textContent =
        "V8 läuft";


    audioContext.resume();

    engineLoop();
}


////////////////////////////////////////////////////////////
// CREATE OSCILLATOR
////////////////////////////////////////////////////////////

function createOscillator(
    type,
    destination
) {

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type = type;

    gain.gain.value = 0;


    oscillator.connect(gain);

    gain.connect(destination);

    oscillator.start();


    oscillator._gain = gain;


    return oscillator;
}


////////////////////////////////////////////////////////////
// ENGINE LOOP
////////////////////////////////////////////////////////////

function engineLoop() {

    if (!engineRunning) {
        return;
    }


    ////////////////////////////////////////////////////////
    // RPM SMOOTHING
    ////////////////////////////////////////////////////////

    currentRPM +=
        (targetRPM - currentRPM) * 0.07;


    ////////////////////////////////////////////////////////
    // LOAD SMOOTHING
    ////////////////////////////////////////////////////////

    currentLoad +=
        (targetLoad - currentLoad) * 0.06;


    ////////////////////////////////////////////////////////
    // V8 FIRING FREQUENCY
    //
    // 8 Zylinder
    // 4-Takt
    //
    // 8 Zündungen pro 2 Kurbelwellenumdrehungen
    //
    ////////////////////////////////////////////////////////

    const firingFrequency =
        currentRPM / 15;


    ////////////////////////////////////////////////////////
    // LOW FREQUENCY RUMBLE
    ////////////////////////////////////////////////////////

    oscillator1.frequency.setTargetAtTime(

        firingFrequency * 0.5,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // MAIN EXHAUST
    ////////////////////////////////////////////////////////

    oscillator2.frequency.setTargetAtTime(

        firingFrequency,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // HIGHER HARMONICS
    ////////////////////////////////////////////////////////

    oscillator3.frequency.setTargetAtTime(

        firingFrequency * 2,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // ENGINE BODY
    ////////////////////////////////////////////////////////

    oscillator4.frequency.setTargetAtTime(

        firingFrequency * 1.5,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // IDLE CHARACTER
    ////////////////////////////////////////////////////////

    let idleFactor = 0;

    if (currentRPM < 1300) {

        idleFactor =
            1 -
            ((currentRPM - 750) / 550);

        idleFactor =
            Math.max(
                0,
                Math.min(
                    1,
                    idleFactor
                )
            );
    }


    ////////////////////////////////////////////////////////
    // UNRUHIGER LEERLAUF
    ////////////////////////////////////////////////////////

    const idlePulse =
        Math.sin(
            performance.now() / 130
        ) * idleFactor;


    ////////////////////////////////////////////////////////
    // RUMBLE
    ////////////////////////////////////////////////////////

    const rumbleVolume =
        0.13 +
        currentLoad * 0.15 +
        idlePulse * 0.025;


    oscillator1._gain.gain.setTargetAtTime(

        Math.max(
            0.03,
            rumbleVolume
        ),

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // DEEP EXHAUST
    ////////////////////////////////////////////////////////

    const exhaustVolume =
        0.08 +
        currentLoad * 0.20 +
        idleFactor * 0.04;


    oscillator2._gain.gain.setTargetAtTime(

        exhaustVolume,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // AGGRESSIVE HARMONICS
    ////////////////////////////////////////////////////////

    const harmonicVolume =
        0.015 +
        currentLoad * 0.08;


    oscillator3._gain.gain.setTargetAtTime(

        harmonicVolume,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // ENGINE BODY
    ////////////////////////////////////////////////////////

    oscillator4._gain.gain.setTargetAtTime(

        0.02 +
        currentLoad * 0.08,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////

    const filterFrequency =

        250 +

        currentRPM * 0.20 +

        currentLoad * 1800;


    filter.frequency.setTargetAtTime(

        Math.min(
            5000,
            filterFrequency
        ),

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////
    // MASTER VOLUME
    ////////////////////////////////////////////////////////

    let volume =

        0.22 +

        currentLoad * 0.35;


    ////////////////////////////////////////////////////////
    // IDLE ETWAS LEISER
    ////////////////////////////////////////////////////////

    if (currentRPM < 1000) {

        volume *= 0.85;
    }


    masterGain.gain.setTargetAtTime(

        volume,

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////
    // NEXT UPDATE
    ////////////////////////////////////////////////////////

    setTimeout(
        engineLoop,
        25
    );
}


////////////////////////////////////////////////////////////
// SPEED → ENGINE MODEL
////////////////////////////////////////////////////////////

function updateEngineFromSpeed() {

    ////////////////////////////////////////////////////////
    // SPEED
    ////////////////////////////////////////////////////////

    const speed =
        simulatedSpeed;


    ////////////////////////////////////////////////////////
    // RPM CURVE
    //
    // 0 km/h   = 800 RPM
    // 20 km/h  = 1300 RPM
    // 50 km/h  = 2100 RPM
    // 100 km/h = 3400 RPM
    // 150 km/h = 4700 RPM
    // 200 km/h = 6000 RPM
    //
    ////////////////////////////////////////////////////////

    let rpm =

        800 +

        speed * 25;


    ////////////////////////////////////////////////////////
    // LIMIT
    ////////////////////////////////////////////////////////

    rpm =
        Math.max(
            750,
            Math.min(
                6500,
                rpm
            )
        );


    targetRPM = rpm;


    ////////////////////////////////////////////////////////
    // VIRTUELLE MOTORLAST
    ////////////////////////////////////////////////////////

    let load = 0;


    if (speed < 3) {

        // Leerlauf
        load = 0.05;

    } else {

        // Grundlast steigt mit Geschwindigkeit

        load =
            0.10 +
            speed / 500;
    }


    ////////////////////////////////////////////////////////
    // BEI NIEDRIGER GESCHWINDIGKEIT
    // mehr "blubbernder" Charakter
    ////////////////////////////////////////////////////////

    if (speed < 20) {

        load += 0.05;
    }


    ////////////////////////////////////////////////////////
    // LIMIT
    ////////////////////////////////////////////////////////

    load =
        Math.max(
            0.03,
            Math.min(
                1,
                load
            )
        );


    targetLoad = load;


    ////////////////////////////////////////////////////////
    // DISPLAY
    ////////////////////////////////////////////////////////

    document
        .getElementById("speedValue")
        .textContent =
        Math.round(speed);


    document
        .getElementById("rpmValue")
        .textContent =
        Math.round(currentRPM);


    document
        .getElementById("loadValue")
        .textContent =
        Math.round(currentLoad * 100);
}


////////////////////////////////////////////////////////////
// SPEED SLIDER
////////////////////////////////////////////////////////////

const speedSlider =
    document.getElementById(
        "speedSlider"
    );


speedSlider.addEventListener(
    "input",
    function() {

        simulatedSpeed =
            Number(
                speedSlider.value
            );


        updateEngineFromSpeed();

    }
);


////////////////////////////////////////////////////////////
// DISPLAY LOOP
////////////////////////////////////////////////////////////

function displayLoop() {

    document
        .getElementById("rpmValue")
        .textContent =
        Math.round(currentRPM);


    document
        .getElementById("loadValue")
        .textContent =
        Math.round(currentLoad * 100);


    requestAnimationFrame(
        displayLoop
    );
}


////////////////////////////////////////////////////////////
// START BUTTON
////////////////////////////////////////////////////////////

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function() {

            startEngine();

        }
    );


////////////////////////////////////////////////////////////
// INITIALIZE
////////////////////////////////////////////////////////////

updateEngineFromSpeed();

displayLoop();

</script>

</body>
</html>
