<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old American V8 GPS Sound</title>

<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 20px;
    }

    button {
        font-size: 22px;
        padding: 15px 30px;
        margin: 10px;
        border-radius: 10px;
        border: none;
        background: #c62828;
        color: white;
    }

    button:active {
        background: #8e0000;
    }

    .box {
        max-width: 600px;
        margin: auto;
        background: #1c1c1c;
        padding: 20px;
        border-radius: 15px;
    }

    .value {
        font-size: 32px;
        margin: 12px 0;
    }

    .small {
        color: #aaa;
        font-size: 16px;
    }

    #status {
        margin-top: 15px;
        color: #0f0;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🇺🇸 Old American V8</h1>

    <button id="startButton">
        🔊 V8 STARTEN
    </button>

    <div class="value">
        Geschwindigkeit:
        <span id="speed">0</span> km/h
    </div>

    <div class="value">
        Drehzahl:
        <span id="rpm">800</span> RPM
    </div>

    <div class="value">
        Last:
        <span id="load">0</span> %
    </div>

    <div class="small">
        Beschleunigung:
        <span id="accel">0</span> m/s²
    </div>

    <div class="small">
        GPS Genauigkeit:
        <span id="accuracy">---</span> m
    </div>

    <div id="status">
        Warte auf GPS...
    </div>

</div>

<script>

////////////////////////////////////////////////////////////
// GPS
////////////////////////////////////////////////////////////

let currentSpeed = 0;
let previousSpeed = null;
let previousTime = null;

let acceleration = 0;
let smoothAcceleration = 0;

navigator.geolocation.watchPosition(

    function(position) {

        const coords = position.coords;

        let speedMS = coords.speed;

        // Manche Geräte liefern null.
        // Dann berechnen wir Geschwindigkeit aus Positionsänderung
        // nicht direkt, sondern lassen den letzten Wert stehen.
        if (speedMS == null || isNaN(speedMS)) {
            speedMS = currentSpeed / 3.6;
        }

        const speedKMH = Math.max(0, speedMS * 3.6);

        const now = performance.now();

        ////////////////////////////////////////////////////////
        // Beschleunigung
        ////////////////////////////////////////////////////////

        if (previousSpeed !== null && previousTime !== null) {

            const dt = (now - previousTime) / 1000;

            if (dt > 0.05 && dt < 5) {

                acceleration =
                    (speedMS - previousSpeed) / dt;

                // GPS kann stark rauschen.
                // Deshalb glätten wir die Beschleunigung.
                smoothAcceleration =
                    smoothAcceleration * 0.80 +
                    acceleration * 0.20;
            }
        }

        previousSpeed = speedMS;
        previousTime = now;

        currentSpeed = speedKMH;

        ////////////////////////////////////////////////////////
        // Anzeige
        ////////////////////////////////////////////////////////

        document.getElementById("speed").textContent =
            speedKMH.toFixed(1);

        document.getElementById("accel").textContent =
            smoothAcceleration.toFixed(2);

        document.getElementById("accuracy").textContent =
            coords.accuracy
                ? coords.accuracy.toFixed(0)
                : "---";

        updateEngine();

    },

    function(error) {

        document.getElementById("status").textContent =
            "GPS Fehler: " + error.message;

    },

    {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
    }
);


////////////////////////////////////////////////////////////
// AUDIO
////////////////////////////////////////////////////////////

let audioContext = null;

let masterGain = null;
let exhaustGain = null;
let rumbleGain = null;
let intakeGain = null;

let filter = null;

let engineRunning = false;

////////////////////////////////////////////////////////////
// V8 PARAMETER
////////////////////////////////////////////////////////////

let targetRPM = 800;
let engineRPM = 800;

let targetLoad = 0;
let engineLoad = 0;

////////////////////////////////////////////////////////////
// V8 AUDIO
////////////////////////////////////////////////////////////

function startEngine() {

    if (engineRunning) {
        return;
    }

    audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    ////////////////////////////////////////////////////////////
    // Master
    ////////////////////////////////////////////////////////////

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.0;

    masterGain.connect(audioContext.destination);


    ////////////////////////////////////////////////////////////
    // Tiefes Auspuff-/Motorgeräusch
    ////////////////////////////////////////////////////////////

    rumbleGain =
        audioContext.createGain();

    rumbleGain.gain.value = 0.5;

    rumbleGain.connect(masterGain);


    ////////////////////////////////////////////////////////////
    // Exhaust
    ////////////////////////////////////////////////////////////

    exhaustGain =
        audioContext.createGain();

    exhaustGain.gain.value = 0.6;

    exhaustGain.connect(masterGain);


    ////////////////////////////////////////////////////////////
    // Intake
    ////////////////////////////////////////////////////////////

    intakeGain =
        audioContext.createGain();

    intakeGain.gain.value = 0.0;

    intakeGain.connect(masterGain);


    ////////////////////////////////////////////////////////////
    // Low Pass
    ////////////////////////////////////////////////////////////

    filter =
        audioContext.createBiquadFilter();

    filter.type = "lowpass";

    filter.frequency.value = 700;

    filter.Q.value = 1.0;

    filter.connect(exhaustGain);


    ////////////////////////////////////////////////////////////
    // Grundfrequenzen
    ////////////////////////////////////////////////////////////

    createEngineOscillator(
        1,
        "sawtooth",
        rumbleGain
    );

    createEngineOscillator(
        2,
        "square",
        filter
    );

    createEngineOscillator(
        3,
        "triangle",
        filter
    );


    engineRunning = true;

    document.getElementById("status").textContent =
        "🔥 V8 läuft";

    audioContext.resume();

    engineLoop();
}


////////////////////////////////////////////////////////////
// ENGINE OSCILLATOR
////////////////////////////////////////////////////////////

function createEngineOscillator(
    number,
    type,
    destination
) {

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    gain.gain.value = 0;

    osc.connect(gain);
    gain.connect(destination);

    osc.start();

    osc._gain = gain;
    osc._type = type;

    if (number === 1) {
        window.v8Osc1 = osc;
    }

    if (number === 2) {
        window.v8Osc2 = osc;
    }

    if (number === 3) {
        window.v8Osc3 = osc;
    }
}


////////////////////////////////////////////////////////////
// ENGINE LOOP
////////////////////////////////////////////////////////////

function engineLoop() {

    if (!engineRunning) {
        return;
    }

    ////////////////////////////////////////////////////////////
    // RPM glätten
    ////////////////////////////////////////////////////////////

    engineRPM +=
        (targetRPM - engineRPM) * 0.08;


    ////////////////////////////////////////////////////////////
    // Last glätten
    ////////////////////////////////////////////////////////////

    engineLoad +=
        (targetLoad - engineLoad) * 0.08;


    ////////////////////////////////////////////////////////////
    // Kurbelwellenfrequenz
    //
    // 4-Takt V8:
    //
    // 8 Zündungen pro 2 Umdrehungen
    //
    // firing frequency =
    // RPM * 8 / 120
    //
    ////////////////////////////////////////////////////////////

    const firingFrequency =
        engineRPM / 15;


    ////////////////////////////////////////////////////////////
    // Grundfrequenz
    ////////////////////////////////////////////////////////////

    const baseFrequency =
        firingFrequency;


    ////////////////////////////////////////////////////////////
    // V8 Charakter
    ////////////////////////////////////////////////////////////

    if (window.v8Osc1) {

        window.v8Osc1.frequency.setTargetAtTime(
            baseFrequency * 0.50,
            audioContext.currentTime,
            0.03
        );

        window.v8Osc1._gain.gain.setTargetAtTime(
            0.22 + engineLoad * 0.18,
            audioContext.currentTime,
            0.03
        );
    }


    if (window.v8Osc2) {

        window.v8Osc2.frequency.setTargetAtTime(
            baseFrequency * 1.0,
            audioContext.currentTime,
            0.03
        );

        window.v8Osc2._gain.gain.setTargetAtTime(
            0.04 + engineLoad * 0.10,
            audioContext.currentTime,
            0.03
        );
    }


    if (window.v8Osc3) {

        window.v8Osc3.frequency.setTargetAtTime(
            baseFrequency * 2.0,
            audioContext.currentTime,
            0.03
        );

        window.v8Osc3._gain.gain.setTargetAtTime(
            0.02 + engineLoad * 0.08,
            audioContext.currentTime,
            0.03
        );
    }


    ////////////////////////////////////////////////////////////
    // Filter
    ////////////////////////////////////////////////////////////

    if (filter) {

        const filterFrequency =
            300 +
            engineRPM * 0.18 +
            engineLoad * 900;

        filter.frequency.setTargetAtTime(
            Math.min(5000, filterFrequency),
            audioContext.currentTime,
            0.05
        );
    }


    ////////////////////////////////////////////////////////////
    // Hauptlautstärke
    ////////////////////////////////////////////////////////////

    let volume =
        0.35 +
        engineLoad * 0.30;

    // Im Stand nicht zu laut
    if (engineRPM < 1000) {
        volume *= 0.75;
    }

    masterGain.gain.setTargetAtTime(
        volume,
        audioContext.currentTime,
        0.05
    );


    ////////////////////////////////////////////////////////////
    // Nächsten Zyklus planen
    ////////////////////////////////////////////////////////////

    setTimeout(engineLoop, 30);
}


////////////////////////////////////////////////////////////
// ENGINE MODEL
////////////////////////////////////////////////////////////

function updateEngine() {

    ////////////////////////////////////////////////////////////
    // Geschwindigkeit
    ////////////////////////////////////////////////////////////

    const speed =
        currentSpeed;


    ////////////////////////////////////////////////////////////
    // Drehzahl aus Geschwindigkeit
    //
    // 0 km/h   = ~800 RPM
    // 10 km/h  = ~1100 RPM
    // 50 km/h  = ~2200 RPM
    // 100 km/h = ~3700 RPM
    // 200 km/h = ~6000 RPM
    //
    ////////////////////////////////////////////////////////////

    let rpm =
        800 +
        speed * 26;


    ////////////////////////////////////////////////////////////
    // Bei höherer Beschleunigung etwas mehr Drehzahl
    ////////////////////////////////////////////////////////////

    if (smoothAcceleration > 0.2) {

        rpm +=
            smoothAcceleration * 350;
    }


    ////////////////////////////////////////////////////////////
    // Begrenzen
    ////////////////////////////////////////////////////////////

    rpm =
        Math.max(750, rpm);

    rpm =
        Math.min(6500, rpm);


    targetRPM = rpm;


    ////////////////////////////////////////////////////////////
    // LAST
    ////////////////////////////////////////////////////////////

    // Beschleunigung positiv =
    // Fahrer gibt virtuell Gas

    let load =
        Math.max(
            0,
            smoothAcceleration / 2.5
        );


    ////////////////////////////////////////////////////////////
    // Bei höherem Tempo etwas Grundlast
    ////////////////////////////////////////////////////////////

    if (speed > 10) {

        load +=
            Math.min(
                0.35,
                speed / 300
            );
    }


    ////////////////////////////////////////////////////////////
    // Bei Stillstand fast keine Last
    ////////////////////////////////////////////////////////////

    if (speed < 2) {
        load *= 0.15;
    }


    load =
        Math.max(
            0,
            Math.min(
                1,
                load
            )
        );


    targetLoad = load;


    ////////////////////////////////////////////////////////////
    // Anzeige
    ////////////////////////////////////////////////////////////

    document.getElementById("rpm").textContent =
        Math.round(engineRPM);

    document.getElementById("load").textContent =
        Math.round(engineLoad * 100);
}


////////////////////////////////////////////////////////////
// START BUTTON
////////////////////////////////////////////////////////////

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function() {

            startEngine();

        }
    );

</script>

</body>
</html>
