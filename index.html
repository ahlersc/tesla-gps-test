<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V8 Engine Simulator</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 25px 15px;
    }

    h1 {
        margin-bottom: 10px;
        font-size: 28px;
    }

    .status {
        color: #aaa;
        margin-bottom: 25px;
    }

    .box {
        max-width: 600px;
        margin: auto;
        background: #1c1c1c;
        border-radius: 16px;
        padding: 25px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-bottom: 12px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        background: #333;
        color: white;
    }

    button.active {
        background: #b71c1c;
    }

    #start {
        background: #d32f2f;
    }

    .speed {
        font-size: 56px;
        font-weight: bold;
        margin: 25px 0 5px;
    }

    .unit {
        color: #aaa;
        font-size: 18px;
        margin-bottom: 25px;
    }

    .slider {
        width: 100%;
        height: 45px;
    }

    input[type="range"] {
        width: 100%;
        height: 45px;
    }

    .sliderValue {
        font-size: 24px;
        margin-top: 10px;
        color: #ff5252;
    }

    .rpm {
        font-size: 34px;
        margin-top: 30px;
    }

    .info {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #333;
        color: #aaa;
        line-height: 1.8;
    }

    .gps {
        display: none;
    }
</style>
</head>

<body>

<h1>🔥 V8 ENGINE SIMULATOR</h1>

<div class="status" id="status">
    SIMULATION
</div>

<div class="box">

    <button id="simulationButton" class="active">
        🎚️ SCHIEBEREGLER
    </button>

    <button id="gpsButton">
        🛰️ GPS
    </button>

    <button id="start">
        🔊 V8 STARTEN
    </button>

    <div class="speed" id="speed">
        0
    </div>

    <div class="unit">
        km/h
    </div>

    <div id="simulationControls">

        <input
            id="speedSlider"
            class="slider"
            type="range"
            min="0"
            max="200"
            step="1"
            value="0"
        >

        <div class="sliderValue">
            <span id="sliderValue">0</span> km/h
        </div>

    </div>

    <div class="gps" id="gpsInfo">
        GPS wird gestartet...
    </div>

    <div class="rpm">
        <span id="rpm">750</span> RPM
    </div>

    <div class="info">
        <div>Geschwindigkeit: <span id="debugSpeed">0</span> km/h</div>
        <div>Drehzahl: <span id="debugRPM">750</span></div>
        <div>Modus: <span id="debugMode">SIMULATION</span></div>
        <div>Audio: <span id="debugAudio">AUS</span></div>
    </div>

</div>


<script>

/* =========================================================
   ELEMENTE
========================================================= */

const speedSlider = document.getElementById("speedSlider");
const sliderValue = document.getElementById("sliderValue");

const speedDisplay = document.getElementById("speed");
const rpmDisplay = document.getElementById("rpm");

const debugSpeed = document.getElementById("debugSpeed");
const debugRPM = document.getElementById("debugRPM");
const debugMode = document.getElementById("debugMode");
const debugAudio = document.getElementById("debugAudio");

const statusDisplay = document.getElementById("status");

const simulationButton =
    document.getElementById("simulationButton");

const gpsButton =
    document.getElementById("gpsButton");

const startButton =
    document.getElementById("start");

const simulationControls =
    document.getElementById("simulationControls");

const gpsInfo =
    document.getElementById("gpsInfo");


/* =========================================================
   VARIABLEN
========================================================= */

let simulationMode = true;

let requestedSpeed = 0;
let gpsSpeed = 0;

let actualSpeed = 0;
let rpm = 750;

let audioStarted = false;

let audioContext = null;

let masterGain = null;
let filter = null;

let osc1 = null;
let osc2 = null;
let osc3 = null;
let osc4 = null;


/* =========================================================
   SCHIEBEREGLER
========================================================= */

/*
   WICHTIG:

   Der Regler schreibt DIREKT in requestedSpeed.

   Dadurch ist der Slider völlig unabhängig vom Audio.
*/

speedSlider.addEventListener("input", function () {

    requestedSpeed = Number(this.value);

    sliderValue.textContent = requestedSpeed;

    /*
       Geschwindigkeit sofort anzeigen.
       Kein Warten auf Audio oder GPS.
    */
    if (simulationMode) {
        speedDisplay.textContent =
            Math.round(requestedSpeed);

        debugSpeed.textContent =
            Math.round(requestedSpeed);
    }

});


/* =========================================================
   SIMULATION MODUS
========================================================= */

simulationButton.addEventListener("click", function () {

    simulationMode = true;

    simulationButton.classList.add("active");
    gpsButton.classList.remove("active");

    simulationControls.style.display = "block";
    gpsInfo.style.display = "none";

    statusDisplay.textContent = "SIMULATION";
    debugMode.textContent = "SIMULATION";

});


/* =========================================================
   GPS MODUS
========================================================= */

gpsButton.addEventListener("click", function () {

    simulationMode = false;

    gpsButton.classList.add("active");
    simulationButton.classList.remove("active");

    simulationControls.style.display = "none";
    gpsInfo.style.display = "block";

    statusDisplay.textContent = "GPS";
    debugMode.textContent = "GPS";

    startGPS();

});


/* =========================================================
   GPS
========================================================= */

function startGPS() {

    if (!navigator.geolocation) {

        gpsInfo.textContent =
            "GPS wird vom Browser nicht unterstützt.";

        return;
    }

    gpsInfo.textContent =
        "GPS wird gesucht...";

    navigator.geolocation.watchPosition(

        function(position) {

            let speed =
                position.coords.speed;

            if (
                speed !== null &&
                speed !== undefined &&
                !isNaN(speed)
            ) {

                gpsSpeed =
                    speed * 3.6;

                gpsInfo.textContent =
                    "GPS aktiv: " +
                    gpsSpeed.toFixed(1) +
                    " km/h";
            }

        },

        function(error) {

            gpsInfo.textContent =
                "GPS Fehler: " +
                error.message;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 5000
        }

    );

}


/* =========================================================
   V8 AUDIO START
========================================================= */

startButton.addEventListener("click", function() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        createEngine();

    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    audioStarted = true;

    debugAudio.textContent = "AN";

    startButton.textContent =
        "🔊 V8 LÄUFT";

});


/* =========================================================
   AUDIO MOTOR
========================================================= */

function createEngine() {

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0.45;

    filter =
        audioContext.createBiquadFilter();

    filter.type =
        "lowpass";

    filter.frequency.value =
        1200;

    filter.Q.value =
        0.8;


    osc1 =
        audioContext.createOscillator();

    osc2 =
        audioContext.createOscillator();

    osc3 =
        audioContext.createOscillator();

    osc4 =
        audioContext.createOscillator();


    osc1.type = "sawtooth";
    osc2.type = "square";
    osc3.type = "triangle";
    osc4.type = "sawtooth";


    const g1 =
        audioContext.createGain();

    const g2 =
        audioContext.createGain();

    const g3 =
        audioContext.createGain();

    const g4 =
        audioContext.createGain();


    g1.gain.value = 0.35;
    g2.gain.value = 0.12;
    g3.gain.value = 0.18;
    g4.gain.value = 0.08;


    osc1.connect(g1);
    osc2.connect(g2);
    osc3.connect(g3);
    osc4.connect(g4);


    g1.connect(filter);
    g2.connect(filter);
    g3.connect(filter);
    g4.connect(filter);


    filter.connect(masterGain);

    masterGain.connect(
        audioContext.destination
    );


    osc1.start();
    osc2.start();
    osc3.start();
    osc4.start();

}


/* =========================================================
   MOTOR MODELL
========================================================= */

function calculateRPM(speed) {

    if (speed <= 0)
        return 750;

    if (speed < 5)
        return 800;

    if (speed < 10)
        return 950;

    if (speed < 20)
        return 1200;

    if (speed < 30)
        return 1500;

    if (speed < 40)
        return 1750;

    if (speed < 60)
        return 2250;

    if (speed < 80)
        return 2800;

    if (speed < 100)
        return 3350;

    if (speed < 120)
        return 3900;

    if (speed < 150)
        return 4700;

    if (speed < 180)
        return 5400;

    return 6000;
}


/* =========================================================
   AUDIO UPDATE
========================================================= */

function updateAudio() {

    if (!audioStarted ||
        !audioContext)
        return;


    const now =
        audioContext.currentTime;


    /*
       Grundfrequenz
    */

    const baseFrequency =
        28 + rpm / 18;


    /*
       Mehrere harmonische Frequenzen
       für V8-artigen Sound
    */

    osc1.frequency.setTargetAtTime(
        baseFrequency,
        now,
        0.03
    );

    osc2.frequency.setTargetAtTime(
        baseFrequency * 2.01,
        now,
        0.03
    );

    osc3.frequency.setTargetAtTime(
        baseFrequency * 0.5,
        now,
        0.03
    );

    osc4.frequency.setTargetAtTime(
        baseFrequency * 3.01,
        now,
        0.03
    );


    /*
       Filter öffnet bei höherer Drehzahl
    */

    filter.frequency.setTargetAtTime(
        700 + rpm * 0.45,
        now,
        0.05
    );


    /*
       Lautstärke
    */

    const volume =
        0.25 +
        Math.min(rpm / 6000, 1) * 0.35;

    masterGain.gain.setTargetAtTime(
        volume,
        now,
        0.05
    );

}


/* =========================================================
   HAUPTSCHLEIFE
========================================================= */

function loop() {

    /*
       Zielgeschwindigkeit bestimmen
    */

    let targetSpeed;

    if (simulationMode) {

        targetSpeed =
            requestedSpeed;

    } else {

        targetSpeed =
            gpsSpeed;

    }


    /*
       Geschwindigkeit sanft folgen lassen
    */

    actualSpeed +=
        (targetSpeed - actualSpeed) *
        0.12;


    /*
       Drehzahl berechnen
    */

    rpm =
        calculateRPM(actualSpeed);


    /*
       Anzeige
    */

    speedDisplay.textContent =
        Math.round(actualSpeed);

    rpmDisplay.textContent =
        Math.round(rpm);

    debugSpeed.textContent =
        Math.round(actualSpeed);

    debugRPM.textContent =
        Math.round(rpm);


    /*
       Audio
    */

    updateAudio();


    requestAnimationFrame(loop);

}


/* =========================================================
   START
========================================================= */

loop();

</script>

</body>
</html>
