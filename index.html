<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tesla Sensor Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .app {
      width: 92%;
      max-width: 750px;
      margin: auto;
      padding: 25px 0 40px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #status {
      color: #aaa;
      font-size: 19px;
      margin-bottom: 25px;
    }

    .speed {
      font-size: 90px;
      font-weight: bold;
      line-height: 1;
    }

    .unit {
      font-size: 24px;
      color: #aaa;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #222;
      border-radius: 18px;
      padding: 18px 10px;
    }

    .label {
      color: #aaa;
      font-size: 16px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .state {
      background: #222;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
      font-size: 25px;
      font-weight: bold;
    }

    .sensor {
      margin-top: 15px;
      background: #181818;
      border-radius: 18px;
      padding: 20px;
      text-align: left;
    }

    .sensor h2 {
      text-align: center;
      font-size: 22px;
      margin-top: 0;
    }

    .sensor-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 18px;
    }

    .sensor-row:last-child {
      border-bottom: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    #start {
      background: white;
      color: black;
    }

    #stop {
      background: #444;
      color: white;
    }

    .info {
      color: #777;
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="app">

  <h1>🚗 Tesla Sensor Test</h1>

  <div id="status">
    Bereit
  </div>


  <!-- GPS Geschwindigkeit -->

  <div class="speed" id="speed">
    0.0
  </div>

  <div class="unit">
    km/h
  </div>


  <!-- GPS Werte -->

  <div class="grid">

    <div class="card">

      <div class="label">
        GPS Beschleunigung
      </div>

      <div class="value" id="gpsAccel">
        0.00 m/s²
      </div>

    </div>


    <div class="card">

      <div class="label">
        GPS G-Wert
      </div>

      <div class="value" id="gpsG">
        0.00 G
      </div>

    </div>


    <div class="card">

      <div class="label">
        GPS Genauigkeit
      </div>

      <div class="value" id="accuracy">
        —
      </div>

    </div>


    <div class="card">

      <div class="label">
        GPS Status
      </div>

      <div class="value" id="gpsStatus">
        —
      </div>

    </div>

  </div>


  <!-- Fahrzustand -->

  <div class="state" id="state">
    Warten
  </div>


  <!-- DeviceMotion -->

  <div class="sensor">

    <h2>
      📱 DeviceMotion Sensor
    </h2>


    <div class="sensor-row">

      <span>
        Sensor verfügbar
      </span>

      <strong id="motionAvailable">
        NEIN
      </strong>

    </div>


    <div class="sensor-row">

      <span>
        X
      </span>

      <strong id="motionX">
        —
      </strong>

    </div>


    <div class="sensor-row">

      <span>
        Y
      </span>

      <strong id="motionY">
        —
      </strong>

    </div>


    <div class="sensor-row">

      <span>
        Z
      </span>

      <strong id="motionZ">
        —
      </strong>

    </div>


    <div class="sensor-row">

      <span>
        Bewegung
      </span>

      <strong id="motionStatus">
        Keine Daten
      </strong>

    </div>

  </div>


  <!-- Buttons -->

  <button id="start">
    📍 GPS + SENSOR STARTEN
  </button>


  <button id="stop" disabled>
    ⏹ STOPPEN
  </button>


  <div class="info">

    Diese Seite testet ausschließlich Browser-Sensoren.
    Es werden keine Tesla-API-Daten verwendet.

  </div>

</div>


<script>


/* =====================================================
   GRUNDWERTE
   ===================================================== */

let watchId = null;

let lastSpeed = null;
let lastTime = null;

let filteredGpsAccel = 0;

const alpha = 0.25;

const G = 9.80665;


/* =====================================================
   HTML ELEMENTE
   ===================================================== */

const speedEl =
  document.getElementById("speed");

const gpsAccelEl =
  document.getElementById("gpsAccel");

const gpsGEl =
  document.getElementById("gpsG");

const accuracyEl =
  document.getElementById("accuracy");

const gpsStatusEl =
  document.getElementById("gpsStatus");

const stateEl =
  document.getElementById("state");

const statusEl =
  document.getElementById("status");


const motionAvailableEl =
  document.getElementById("motionAvailable");

const motionXEl =
  document.getElementById("motionX");

const motionYEl =
  document.getElementById("motionY");

const motionZEl =
  document.getElementById("motionZ");

const motionStatusEl =
  document.getElementById("motionStatus");


const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


/* =====================================================
   RESET
   ===================================================== */

function resetValues() {

  speedEl.textContent = "0.0";

  gpsAccelEl.textContent =
    "0.00 m/s²";

  gpsGEl.textContent =
    "0.00 G";

  accuracyEl.textContent =
    "—";

  gpsStatusEl.textContent =
    "—";

  stateEl.textContent =
    "Warten";

  motionXEl.textContent =
    "—";

  motionYEl.textContent =
    "—";

  motionZEl.textContent =
    "—";

  motionStatusEl.textContent =
    "Keine Daten";


  lastSpeed = null;
  lastTime = null;

  filteredGpsAccel = 0;
}


/* =====================================================
   GPS POSITION
   ===================================================== */

function handlePosition(position) {

  const coords =
    position.coords;

  const now =
    position.timestamp || Date.now();


  /*
   * Geschwindigkeit des GPS.
   *
   * Einheit:
   * Meter pro Sekunde
   */

  let speed =
    coords.speed;


  /*
   * Manche Browser liefern hier null.
   */

  if (
    typeof speed !== "number" ||
    !Number.isFinite(speed)
  ) {

    gpsStatusEl.textContent =
      "keine Geschwindigkeit";

    statusEl.textContent =
      "GPS aktiv";

    return;
  }


  /*
   * Negative Geschwindigkeit
   * macht keinen Sinn.
   */

  speed =
    Math.max(0, speed);


  /*
   * m/s -> km/h
   */

  const kmh =
    speed * 3.6;


  speedEl.textContent =
    kmh.toFixed(1);


  gpsStatusEl.textContent =
    "OK";


  /*
   * GPS Genauigkeit
   */

  if (
    typeof coords.accuracy === "number"
  ) {

    accuracyEl.textContent =
      coords.accuracy.toFixed(1) + " m";
  }


  /* ===================================================
     GPS BESCHLEUNIGUNG
     =================================================== */

  if (
    lastSpeed !== null &&
    lastTime !== null
  ) {

    const dt =
      (now - lastTime) / 1000;


    /*
     * Nur sinnvolle Zeitabstände verwenden.
     */

    if (
      dt > 0 &&
      dt < 5
    ) {

      /*
       * Beschleunigung:
       *
       * a = Delta v / Delta t
       */

      const rawAcceleration =
        (speed - lastSpeed) / dt;


      /*
       * GPS ist ziemlich verrauscht.
       *
       * Deshalb glätten wir.
       */

      filteredGpsAccel =
        alpha * rawAcceleration +
        (1 - alpha) *
        filteredGpsAccel;


      /*
       * Beschleunigung anzeigen
       */

      gpsAccelEl.textContent =
        filteredGpsAccel.toFixed(2) +
        " m/s²";


      /*
       * G berechnen
       */

      const gpsG =
        filteredGpsAccel / G;


      gpsGEl.textContent =
        gpsG.toFixed(2) +
        " G";


      /*
       * Fahrzustand
       */

      if (gpsG > 0.05) {

        stateEl.textContent =
          "🚀 BESCHLEUNIGEN";

      }

      else if (gpsG < -0.05) {

        stateEl.textContent =
          "🛑 BREMSEN";

      }

      else {

        stateEl.textContent =
          "➡️ ROLLEN";
      }

    }

  }


  lastSpeed =
    speed;

  lastTime =
    now;


  statusEl.textContent =
    "GPS aktiv";

}


/* =====================================================
   GPS FEHLER
   ===================================================== */

function handleGpsError(error) {

  let message =
    "GPS Fehler";


  if (error.code === 1) {

    message =
      "Standortzugriff verweigert";

  }

  else if (error.code === 2) {

    message =
      "Standort nicht verfügbar";

  }

  else if (error.code === 3) {

    message =
      "GPS Zeitüberschreitung";
  }


  statusEl.textContent =
    message;

  gpsStatusEl.textContent =
    "FEHLER";

}


/* =====================================================
   DEVICE MOTION
   ===================================================== */

function handleMotion(event) {

  /*
   * acceleration enthält normalerweise
   * die Beschleunigung ohne Gravitation.
   */

  const acceleration =
    event.acceleration;


  /*
   * Falls der Browser nur
   * accelerationIncludingGravity liefert,
   * verwenden wir diese als Fallback.
   */

  const accelerationWithGravity =
    event.accelerationIncludingGravity;


  let data =
    acceleration;


  if (!data) {

    data =
      accelerationWithGravity;
  }


  if (!data) {

    motionStatusEl.textContent =
      "Keine Daten";

    return;
  }


  /*
   * Sensor ist vorhanden!
   */

  motionAvailableEl.textContent =
    "JA";


  /*
   * X
   */

  if (
    typeof data.x === "number"
  ) {

    motionXEl.textContent =
      data.x.toFixed(2) +
      " m/s²";

  }


  /*
   * Y
   */

  if (
    typeof data.y === "number"
  ) {

    motionYEl.textContent =
      data.y.toFixed(2) +
      " m/s²";

  }


  /*
   * Z
   */

  if (
    typeof data.z === "number"
  ) {

    motionZEl.textContent =
      data.z.toFixed(2) +
      " m/s²";

  }


  motionStatusEl.textContent =
    "DATEN EMPFANGEN";

}


/* =====================================================
   START
   ===================================================== */

startButton.addEventListener(
  "click",
  async function() {

    resetValues();


    /*
     * GPS starten
     */

    if (
      !("geolocation" in navigator)
    ) {

      statusEl.textContent =
        "GPS wird nicht unterstützt";

      return;
    }


    statusEl.textContent =
      "GPS wird gestartet …";


    watchId =
      navigator.geolocation.watchPosition(
        handlePosition,
        handleGpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );


    /*
     * DeviceMotion starten
     */

    try {

      /*
       * Manche Browser verlangen
       * eine explizite Berechtigung.
       */

      if (
        typeof DeviceMotionEvent !==
        "undefined" &&
        typeof DeviceMotionEvent.requestPermission ===
        "function"
      ) {

        const permission =
          await DeviceMotionEvent.requestPermission();


        if (
          permission === "granted"
        ) {

          window.addEventListener(
            "devicemotion",
            handleMotion
          );

          motionAvailableEl.textContent =
            "BEREIT";

        }

        else {

          motionStatusEl.textContent =
            "Berechtigung abgelehnt";

        }

      }

      else if (
        "DeviceMotionEvent" in window
      ) {

        /*
         * Browser unterstützt DeviceMotion
         * ohne separate Permission.
         */

        window.addEventListener(
          "devicemotion",
          handleMotion
        );

        motionAvailableEl.textContent =
          "BEREIT";

      }

      else {

        motionAvailableEl.textContent =
          "NEIN";

        motionStatusEl.textContent =
          "Nicht unterstützt";
      }

    }

    catch(error) {

      motionAvailableEl.textContent =
        "FEHLER";

      motionStatusEl.textContent =
        error.message || "Fehler";

    }


    startButton.disabled =
      true;

    stopButton.disabled =
      false;

  }
);


/* =====================================================
   STOP
   ===================================================== */

stopButton.addEventListener(
  "click",
  function() {


    if (watchId !== null) {

      navigator.geolocation.clearWatch(
        watchId
      );

      watchId = null;
    }


    window.removeEventListener(
      "devicemotion",
      handleMotion
    );


    statusEl.textContent =
      "Gestoppt";

    stateEl.textContent =
      "Gestoppt";


    startButton.disabled =
      false;

    stopButton.disabled =
      true;

  }
);


</script>

</body>
</html>
