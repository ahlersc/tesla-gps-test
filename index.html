<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla Virtual Engine</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.app {
  width: 92%;
  max-width: 700px;
  margin: auto;
  padding: 25px 0 40px;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.status {
  color: #aaa;
  font-size: 18px;
  margin-bottom: 25px;
}

.speed {
  font-size: 90px;
  font-weight: bold;
  line-height: 1;
}

.unit {
  font-size: 24px;
  color: #aaa;
  margin-bottom: 25px;
}

.card {
  background: #222;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 12px;
}

.label {
  color: #aaa;
  font-size: 17px;
}

.value {
  font-size: 38px;
  font-weight: bold;
  margin-top: 8px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 20px;
  margin-top: 10px;
  font-size: 22px;
  font-weight: bold;
}

#start {
  background: white;
  color: black;
}

#stop {
  background: #444;
  color: white;
}

.info {
  color: #777;
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.5;
}

</style>
</head>


<body>

<div class="app">

<h1>🏎️ Tesla Virtual Engine</h1>

<div class="status" id="status">
Bereit
</div>

<div class="speed" id="speed">
0
</div>

<div class="unit">
km/h
</div>

<div class="card">

<div class="label">
Virtuelle Drehzahl
</div>

<div class="value" id="rpm">
800 RPM
</div>

</div>

<div class="card">

<div class="label">
Motorlast
</div>

<div class="value" id="load">
0 %
</div>

</div>

<button id="start">
🔊 MOTOR STARTEN
</button>

<button id="stop" disabled>
⏹ STOPPEN
</button>

<div class="info">

Virtueller Mehrzylinder-Motorsound.
Die Drehzahl wird aus der GPS-Geschwindigkeit
berechnet.

</div>

</div>


<script>


/* =====================================================
   GPS
   ===================================================== */

let watchId = null;

let currentSpeed = 0;
let targetSpeed = 0;

let lastSpeed = null;
let lastTime = null;

let acceleration = 0;


/* =====================================================
   AUDIO
   ===================================================== */

let audioContext = null;

let masterGain = null;

let lowOsc = null;
let midOsc = null;
let highOsc = null;

let lowGain = null;
let midGain = null;
let highGain = null;

let engineFilter = null;

let engineStarted = false;


/* =====================================================
   HTML
   ===================================================== */

const speedElement =
  document.getElementById("speed");

const rpmElement =
  document.getElementById("rpm");

const loadElement =
  document.getElementById("load");

const statusElement =
  document.getElementById("status");

const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


/* =====================================================
   MOTOR SOUND INITIALISIEREN
   ===================================================== */

function startEngineSound() {

  if (engineStarted) {
    return;
  }


  audioContext =
    new (window.AudioContext ||
    window.webkitAudioContext)();


  /*
   * Master-Lautstärke
   */

  masterGain =
    audioContext.createGain();

  masterGain.gain.value =
    0.06;


  /*
   * Filter
   */

  engineFilter =
    audioContext.createBiquadFilter();

  engineFilter.type =
    "lowpass";

  engineFilter.frequency.value =
    1200;

  engineFilter.Q.value =
    1.2;


  /*
   * ===============================================
   * TIEFER MOTOR
   * ===============================================
   */

  lowOsc =
    audioContext.createOscillator();

  lowGain =
    audioContext.createGain();


  lowOsc.type =
    "sawtooth";

  lowGain.gain.value =
    0.7;


  /*
   * ===============================================
   * MITTLERER MOTORANTEIL
   * ===============================================
   */

  midOsc =
    audioContext.createOscillator();

  midGain =
    audioContext.createGain();


  midOsc.type =
    "triangle";

  midGain.gain.value =
    0.35;


  /*
   * ===============================================
   * HOCHFREQUENTER ANTEIL
   * ===============================================
   */

  highOsc =
    audioContext.createOscillator();

  highGain =
    audioContext.createGain();


  highOsc.type =
    "square";

  highGain.gain.value =
    0.08;


  /*
   * AUDIO ROUTING
   */

  lowOsc.connect(
    lowGain
  );

  midOsc.connect(
    midGain
  );

  highOsc.connect(
    highGain
  );


  lowGain.connect(
    engineFilter
  );

  midGain.connect(
    engineFilter
  );

  highGain.connect(
    engineFilter
  );


  engineFilter.connect(
    masterGain
  );


  masterGain.connect(
    audioContext.destination
  );


  /*
   * Start
   */

  lowOsc.start();
  midOsc.start();
  highOsc.start();


  engineStarted = true;
}


/* =====================================================
   ENGINE SOUND
   ===================================================== */

function updateEngineSound() {

  if (
    !engineStarted
  ) {
    return;
  }


  /*
   * -----------------------------------------------
   * VIRTUELLE DREHZAHL
   * -----------------------------------------------
   *
   * 0 km/h     = 850 RPM
   * 200 km/h   = 6500 RPM
   */

  let rpm =
    850 +
    (currentSpeed / 200) * 5650;


  rpm =
    Math.max(
      850,
      Math.min(
        6500,
        rpm
      )
    );


  /*
   * -----------------------------------------------
   * MOTORLAST
   * -----------------------------------------------
   */

  let load =
    Math.abs(acceleration) * 25;


  /*
   * Grundlast bei höherer Geschwindigkeit
   */

  load +=
    currentSpeed * 0.04;


  load =
    Math.max(
      0,
      Math.min(
        100,
        load
      )
    );


  /*
   * -----------------------------------------------
   * MOTORFREQUENZ
   * -----------------------------------------------
   *
   * Ein echter Motor besteht aus vielen
   * Oberwellen.
   */

  const base =
    rpm / 60;


  const fundamental =
    base * 4;


  /*
   * Tiefer Grundton
   */

  lowOsc.frequency.setTargetAtTime(
    fundamental,
    audioContext.currentTime,
    0.03
  );


  /*
   * Mittlere Oberwelle
   */

  midOsc.frequency.setTargetAtTime(
    fundamental * 2.01,
    audioContext.currentTime,
    0.03
  );


  /*
   * Hohe Oberwelle
   */

  highOsc.frequency.setTargetAtTime(
    fundamental * 4.02,
    audioContext.currentTime,
    0.03
  );


  /*
   * -----------------------------------------------
   * LAST -> LAUTSTÄRKE
   * -----------------------------------------------
   */

  let volume =
    0.045 +
    (load / 100) * 0.11;


  /*
   * Standgas
   */

  if (
    currentSpeed < 2
  ) {

    volume =
      0.025;
  }


  /*
   * -----------------------------------------------
   * MOTORBREMSEN
   * -----------------------------------------------
   */

  if (
    acceleration < -0.5
  ) {

    volume *=
      0.55;
  }


  masterGain.gain.setTargetAtTime(
    volume,
    audioContext.currentTime,
    0.08
  );


  /*
   * -----------------------------------------------
   * FILTER
   * -----------------------------------------------
   *
   * Bei höherer Drehzahl öffnet der Motor.
   */

  const filterFrequency =
    650 +
    (rpm / 6500) * 4000;


  engineFilter.frequency.setTargetAtTime(
    filterFrequency,
    audioContext.currentTime,
    0.06
  );


  /*
   * -----------------------------------------------
   * DISPLAY
   * -----------------------------------------------
   */

  rpmElement.textContent =
    Math.round(rpm) +
    " RPM";


  loadElement.textContent =
    Math.round(load) +
    " %";
}


/* =====================================================
   GPS
   ===================================================== */

function handlePosition(position) {

  const now =
    position.timestamp ||
    Date.now();


  let speed =
    position.coords.speed;


  if (
    typeof speed !== "number" ||
    !Number.isFinite(speed)
  ) {

    statusElement.textContent =
      "GPS aktiv – Geschwindigkeit fehlt";

    return;
  }


  speed =
    Math.max(
      0,
      speed
    );


  targetSpeed =
    speed * 3.6;


  /*
   * Beschleunigung berechnen
   */

  if (
    lastSpeed !== null &&
    lastTime !== null
  ) {

    const dt =
      (now - lastTime) / 1000;


    if (
      dt > 0 &&
      dt < 5
    ) {

      const rawAcceleration =
        (speed - lastSpeed) / dt;


      /*
       * Stärkere Glättung
       */

      acceleration =
        acceleration * 0.80 +
        rawAcceleration * 0.20;
    }
  }


  lastSpeed =
    speed;

  lastTime =
    now;


  speedElement.textContent =
    targetSpeed.toFixed(1);


  statusElement.textContent =
    "GPS + Motor aktiv";
}


/* =====================================================
   GPS FEHLER
   ===================================================== */

function handleGpsError(error) {

  if (
    error.code === 1
  ) {

    statusElement.textContent =
      "Standortzugriff verweigert";

  }

  else {

    statusElement.textContent =
      "GPS Fehler";
  }
}


/* =====================================================
   AUDIO LOOP
   ===================================================== */

function audioLoop() {

  /*
   * Drehzahl nicht abrupt ändern.
   */

  currentSpeed +=
    (targetSpeed - currentSpeed) *
    0.06;


  updateEngineSound();


  requestAnimationFrame(
    audioLoop
  );
}


/* =====================================================
   START
   ===================================================== */

startButton.addEventListener(
  "click",
  async function() {


    startEngineSound();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    if (
      !("geolocation" in navigator)
    ) {

      statusElement.textContent =
        "GPS nicht verfügbar";

      return;
    }


    watchId =
      navigator.geolocation.watchPosition(
        handlePosition,
        handleGpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );


    startButton.disabled =
      true;

    stopButton.disabled =
      false;


    statusElement.textContent =
      "Motor + GPS aktiv";


    audioLoop();

  }
);


/* =====================================================
   STOP
   ===================================================== */

stopButton.addEventListener(
  "click",
  function() {


    if (
      watchId !== null
    ) {

      navigator.geolocation.clearWatch(
        watchId
      );

      watchId = null;
    }


    if (
      masterGain &&
      audioContext
    ) {

      masterGain.gain.setTargetAtTime(
        0.0001,
        audioContext.currentTime,
        0.12
      );
    }


    statusElement.textContent =
      "Gestoppt";


    startButton.disabled =
      false;

    stopButton.disabled =
      true;

  }
);

</script>

</body>
</html>
