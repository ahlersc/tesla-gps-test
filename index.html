<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla Fake Engine</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.app {
  width: 92%;
  max-width: 700px;
  margin: auto;
  padding: 25px 0;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.status {
  color: #aaa;
  font-size: 18px;
  margin-bottom: 25px;
}

.speed {
  font-size: 90px;
  font-weight: bold;
  line-height: 1;
}

.unit {
  font-size: 24px;
  color: #aaa;
  margin-bottom: 25px;
}

.card {
  background: #222;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 12px;
}

.label {
  color: #aaa;
  font-size: 17px;
}

.value {
  font-size: 38px;
  font-weight: bold;
  margin-top: 8px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 20px;
  margin-top: 10px;
  font-size: 22px;
  font-weight: bold;
}

#start {
  background: white;
  color: black;
}

#stop {
  background: #444;
  color: white;
}

.info {
  color: #777;
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.5;
}

</style>
</head>


<body>

<div class="app">

<h1>🚗 Tesla Fake Engine</h1>

<div class="status" id="status">
Bereit
</div>


<div class="speed" id="speed">
0
</div>

<div class="unit">
km/h
</div>


<div class="card">

<div class="label">
Virtuelle Drehzahl
</div>

<div class="value" id="rpm">
800 RPM
</div>

</div>


<div class="card">

<div class="label">
Motorlast
</div>

<div class="value" id="load">
0 %
</div>

</div>


<button id="start">
🔊 MOTOR STARTEN
</button>


<button id="stop" disabled>
⏹ STOPPEN
</button>


<div class="info">

Die Drehzahl wird aus der GPS-Geschwindigkeit
berechnet. Der Sound wird direkt im Browser erzeugt.

</div>

</div>


<script>

/* =====================================================
   GPS
   ===================================================== */

let watchId = null;

let currentSpeed = 0;
let targetSpeed = 0;

let lastSpeed = null;
let lastTime = null;

let acceleration = 0;


/* =====================================================
   AUDIO
   ===================================================== */

let audioContext = null;

let oscillator = null;

let gainNode = null;

let filterNode = null;

let audioStarted = false;


/* =====================================================
   HTML
   ===================================================== */

const speedElement =
  document.getElementById("speed");

const rpmElement =
  document.getElementById("rpm");

const loadElement =
  document.getElementById("load");

const statusElement =
  document.getElementById("status");

const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


/* =====================================================
   AUDIO STARTEN
   ===================================================== */

function startEngineSound() {

  if (audioStarted) {
    return;
  }


  audioContext =
    new (window.AudioContext ||
    window.webkitAudioContext)();


  /*
   * Hauptoszillator
   */

  oscillator =
    audioContext.createOscillator();


  /*
   * Lautstärke
   */

  gainNode =
    audioContext.createGain();


  /*
   * Filter macht den Klang etwas weicher.
   */

  filterNode =
    audioContext.createBiquadFilter();


  oscillator.type =
    "sawtooth";


  filterNode.type =
    "lowpass";


  filterNode.frequency.value =
    1200;


  /*
   * Startlautstärke sehr niedrig.
   */

  gainNode.gain.value =
    0.0001;


  oscillator.connect(
    filterNode
  );


  filterNode.connect(
    gainNode
  );


  gainNode.connect(
    audioContext.destination
  );


  oscillator.start();


  audioStarted = true;
}


/* =====================================================
   MOTOR SOUND AKTUALISIEREN
   ===================================================== */

function updateEngineSound() {

  if (
    !audioStarted ||
    !oscillator
  ) {
    return;
  }


  /*
   * Geschwindigkeit -> RPM
   *
   * 0 km/h    = 800 RPM
   * 200 km/h  = 6500 RPM
   */

  let rpm =
    800 +
    (currentSpeed / 200) *
    5700;


  /*
   * Begrenzen
   */

  rpm =
    Math.max(
      800,
      Math.min(
        6500,
        rpm
      )
    );


  /*
   * Beschleunigung macht den Motor
   * etwas aggressiver.
   */

  let load =
    Math.abs(acceleration) * 20;


  load =
    Math.max(
      0,
      Math.min(
        100,
        load
      )
    );


  /*
   * RPM -> Frequenz
   */

  const frequency =
    rpm / 60;


  oscillator.frequency.setTargetAtTime(
    frequency,
    audioContext.currentTime,
    0.04
  );


  /*
   * Lautstärke
   */

  let volume =
    0.015 +
    (load / 100) * 0.06;


  /*
   * Bei Stillstand sehr leise.
   */

  if (currentSpeed < 2) {

    volume =
      0.008;
  }


  gainNode.gain.setTargetAtTime(
    volume,
    audioContext.currentTime,
    0.08
  );


  /*
   * Filter bei hoher Drehzahl öffnen.
   */

  const filterFrequency =
    700 +
    (rpm / 6500) * 2500;


  filterNode.frequency.setTargetAtTime(
    filterFrequency,
    audioContext.currentTime,
    0.08
  );


  rpmElement.textContent =
    Math.round(rpm) +
    " RPM";


  loadElement.textContent =
    Math.round(load) +
    " %";
}


/* =====================================================
   GPS
   ===================================================== */

function handlePosition(position) {

  const now =
    position.timestamp ||
    Date.now();


  let speed =
    position.coords.speed;


  /*
   * Falls speed nicht geliefert wird,
   * versuchen wir aus GPS-Positionen
   * zunächst nichts zu berechnen.
   */

  if (
    typeof speed !== "number" ||
    !Number.isFinite(speed)
  ) {

    statusElement.textContent =
      "GPS aktiv – Geschwindigkeit fehlt";

    return;
  }


  speed =
    Math.max(
      0,
      speed
    );


  targetSpeed =
    speed * 3.6;


  /*
   * Beschleunigung aus
   * Geschwindigkeitsänderung.
   */

  if (
    lastSpeed !== null &&
    lastTime !== null
  ) {

    const dt =
      (now - lastTime) / 1000;


    if (
      dt > 0 &&
      dt < 5
    ) {

      const rawAcceleration =
        (speed - lastSpeed) / dt;


      /*
       * Glättung.
       */

      acceleration =
        acceleration * 0.75 +
        rawAcceleration * 0.25;
    }
  }


  lastSpeed =
    speed;

  lastTime =
    now;


  speedElement.textContent =
    targetSpeed.toFixed(1);


  statusElement.textContent =
    "GPS aktiv";
}


/* =====================================================
   GPS FEHLER
   ===================================================== */

function handleGpsError(error) {

  if (error.code === 1) {

    statusElement.textContent =
      "Standortzugriff verweigert";

  } else {

    statusElement.textContent =
      "GPS Fehler";
  }
}


/* =====================================================
   AUDIO + ANIMATION
   ===================================================== */

function audioLoop() {

  /*
   * Geschwindigkeit langsam anpassen,
   * damit der Motor nicht springt.
   */

  currentSpeed +=
    (targetSpeed - currentSpeed) *
    0.08;


  updateEngineSound();


  requestAnimationFrame(
    audioLoop
  );
}


/* =====================================================
   START
   ===================================================== */

startButton.addEventListener(
  "click",
  async function() {


    /*
     * Audio muss durch Benutzeraktion
     * gestartet werden.
     */

    startEngineSound();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    /*
     * GPS
     */

    if (
      !("geolocation" in navigator)
    ) {

      statusElement.textContent =
        "GPS nicht verfügbar";

      return;
    }


    watchId =
      navigator.geolocation.watchPosition(
        handlePosition,
        handleGpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );


    startButton.disabled =
      true;

    stopButton.disabled =
      false;


    statusElement.textContent =
      "Motor + GPS aktiv";


    audioLoop();
  }
);


/* =====================================================
   STOP
   ===================================================== */

stopButton.addEventListener(
  "click",
  function() {


    if (watchId !== null) {

      navigator.geolocation.clearWatch(
        watchId
      );

      watchId = null;
    }


    if (
      gainNode &&
      audioContext
    ) {

      gainNode.gain.setTargetAtTime(
        0.0001,
        audioContext.currentTime,
        0.1
      );
    }


    statusElement.textContent =
      "Gestoppt";


    startButton.disabled =
      false;

    stopButton.disabled =
      true;
  }
);

</script>

</body>
</html>
