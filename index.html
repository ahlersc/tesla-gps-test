<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old American V8 Simulator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.panel {
    background: #1d1d1d;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
}

.mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.mode-button {
    padding: 16px;
    border: 2px solid #444;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.mode-button.active {
    background: #b71c1c;
    border-color: #e53935;
}

.speed-display {
    text-align: center;
    margin: 20px 0;
}

.speed-number {
    font-size: 60px;
    font-weight: bold;
}

.speed-unit {
    color: #999;
    font-size: 20px;
}

input[type="range"] {
    width: 100%;
    height: 45px;
    accent-color: #d32f2f;
}

.range-labels {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 13px;
}

.gps-info {
    text-align: center;
    color: #aaa;
    margin-top: 12px;
}

.data {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.data-box {
    background: #292929;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.label {
    color: #888;
    font-size: 13px;
    margin-bottom: 5px;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.start-button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #c62828;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.start-button:active {
    background: #8e0000;
}

.status {
    text-align: center;
    margin-top: 15px;
    color: #aaa;
}

.engine-light {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #555;
    margin-right: 7px;
}

.engine-light.running {
    background: #ff3b30;
    box-shadow: 0 0 12px #ff3b30;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>🇺🇸 Old American V8</h1>

<div class="subtitle">
    V8 Sound Simulator
</div>


<!-- MODE -->

<div class="panel">

    <div style="text-align:center;margin-bottom:15px;color:#aaa;">
        GESCHWINDIGKEITSQUELLE
    </div>

    <div class="mode-buttons">

        <button
            id="simulationButton"
            class="mode-button active">
            🎚️ Simulation
        </button>

        <button
            id="gpsButton"
            class="mode-button">
            🛰️ GPS
        </button>

    </div>

</div>


<!-- SPEED -->

<div class="panel">

    <div class="speed-display">

        <div class="speed-number">
            <span id="speedValue">0</span>
        </div>

        <div class="speed-unit">
            km/h
        </div>

    </div>


    <!-- SIMULATION SLIDER -->

    <div id="simulationControl">

        <input
            id="speedSlider"
            type="range"
            min="0"
            max="200"
            step="1"
            value="0">

        <div class="range-labels">
            <span>0</span>
            <span>50</span>
            <span>100</span>
            <span>150</span>
            <span>200</span>
        </div>

    </div>


    <!-- GPS INFO -->

    <div
        id="gpsInfo"
        class="gps-info hidden">

        GPS wird verwendet

        <br>

        Genauigkeit:
        <span id="gpsAccuracy">---</span> m

    </div>

</div>


<!-- ENGINE DATA -->

<div class="panel">

    <div class="data">

        <div class="data-box">

            <div class="label">
                DREHZAHL
            </div>

            <div class="value">
                <span id="rpmValue">
                    750
                </span>
                <span style="font-size:13px;color:#777;">
                    RPM
                </span>
            </div>

        </div>


        <div class="data-box">

            <div class="label">
                MOTORLAST
            </div>

            <div class="value">
                <span id="loadValue">
                    5
                </span>
                <span style="font-size:13px;color:#777;">
                    %
                </span>
            </div>

        </div>

    </div>

</div>


<!-- START -->

<div class="panel">

    <button
        id="startButton"
        class="start-button">

        🔊 V8 STARTEN

    </button>


    <div class="status">

        <span
            id="engineLight"
            class="engine-light">
        </span>

        <span id="statusText">
            Motor aus
        </span>

    </div>

</div>

</div>


<script>

////////////////////////////////////////////////////////////
// MODE
////////////////////////////////////////////////////////////

let mode = "simulation";


////////////////////////////////////////////////////////////
// SPEED
////////////////////////////////////////////////////////////

let simulatedSpeed = 0;

let gpsSpeed = 0;

let currentSpeed = 0;

let previousSpeed = 0;

let speedChange = 0;


////////////////////////////////////////////////////////////
// ENGINE
////////////////////////////////////////////////////////////

let targetRPM = 750;

let currentRPM = 750;

let targetLoad = 0.05;

let currentLoad = 0.05;


////////////////////////////////////////////////////////////
// AUDIO
////////////////////////////////////////////////////////////

let audioContext = null;

let masterGain = null;

let filter = null;

let rumbleGain = null;

let exhaustGain = null;

let aggressiveGain = null;

let oscillator1 = null;

let oscillator2 = null;

let oscillator3 = null;

let oscillator4 = null;

let engineRunning = false;


////////////////////////////////////////////////////////////
// GPS
////////////////////////////////////////////////////////////

let gpsStarted = false;


////////////////////////////////////////////////////////////
// DOM
////////////////////////////////////////////////////////////

const speedSlider =
    document.getElementById(
        "speedSlider"
    );

const simulationButton =
    document.getElementById(
        "simulationButton"
    );

const gpsButton =
    document.getElementById(
        "gpsButton"
    );

const simulationControl =
    document.getElementById(
        "simulationControl"
    );

const gpsInfo =
    document.getElementById(
        "gpsInfo"
    );


////////////////////////////////////////////////////////////
// MODE: SIMULATION
////////////////////////////////////////////////////////////

simulationButton.addEventListener(
    "click",
    function() {

        mode = "simulation";

        simulationButton.classList.add(
            "active"
        );

        gpsButton.classList.remove(
            "active"
        );

        simulationControl.classList.remove(
            "hidden"
        );

        gpsInfo.classList.add(
            "hidden"
        );

        currentSpeed =
            simulatedSpeed;

        updateEngineModel();
    }
);


////////////////////////////////////////////////////////////
// MODE: GPS
////////////////////////////////////////////////////////////

gpsButton.addEventListener(
    "click",
    function() {

        mode = "gps";

        gpsButton.classList.add(
            "active"
        );

        simulationButton.classList.remove(
            "active"
        );

        simulationControl.classList.add(
            "hidden"
        );

        gpsInfo.classList.remove(
            "hidden"
        );

        startGPS();

        currentSpeed =
            gpsSpeed;

        updateEngineModel();
    }
);


////////////////////////////////////////////////////////////
// SIMULATION SLIDER
////////////////////////////////////////////////////////////

speedSlider.addEventListener(
    "input",
    function() {

        const newSpeed =
            Number(
                speedSlider.value
            );


        speedChange =
            newSpeed -
            simulatedSpeed;


        simulatedSpeed =
            newSpeed;


        if (mode === "simulation") {

            currentSpeed =
                simulatedSpeed;

            updateEngineModel();
        }

    }
);


////////////////////////////////////////////////////////////
// GPS START
////////////////////////////////////////////////////////////

function startGPS() {

    if (gpsStarted) {
        return;
    }

    if (!navigator.geolocation) {

        document.getElementById(
            "statusText"
        ).textContent =
            "GPS wird vom Browser nicht unterstützt";

        return;
    }


    gpsStarted = true;


    navigator.geolocation.watchPosition(

        function(position) {

            let speed =
                position.coords.speed;


            ////////////////////////////////////////////////////
            // Falls speed nicht verfügbar
            ////////////////////////////////////////////////////

            if (
                speed === null ||
                isNaN(speed)
            ) {

                speed = gpsSpeed / 3.6;
            }


            gpsSpeed =
                Math.max(
                    0,
                    speed * 3.6
                );


            document.getElementById(
                "gpsAccuracy"
            ).textContent =
                position.coords.accuracy
                    ? position.coords.accuracy.toFixed(0)
                    : "---";


            if (mode === "gps") {

                currentSpeed =
                    gpsSpeed;

                updateEngineModel();
            }

        },

        function(error) {

            document.getElementById(
                "statusText"
            ).textContent =
                "GPS Fehler: " +
                error.message;

        },

        {

            enableHighAccuracy: true,

            maximumAge: 500,

            timeout: 10000

        }
    );
}


////////////////////////////////////////////////////////////
// SPEED → RPM
////////////////////////////////////////////////////////////

function calculateRPM(speed) {

    ////////////////////////////////////////////////////////////
    // Nicht linear!
    ////////////////////////////////////////////////////////////

    const points = [

        [0,   750],

        [5,   800],

        [10,  950],

        [20,  1200],

        [30,  1500],

        [40,  1750],

        [60,  2250],

        [80,  2800],

        [100, 3350],

        [120, 3900],

        [150, 4700],

        [180, 5400],

        [200, 6000]

    ];


    ////////////////////////////////////////////////////////////
    // Unterhalb erster Punkt
    ////////////////////////////////////////////////////////////

    if (speed <= points[0][0]) {

        return points[0][1];
    }


    ////////////////////////////////////////////////////////////
    // Oberhalb letzter Punkt
    ////////////////////////////////////////////////////////////

    if (
        speed >=
        points[points.length - 1][0]
    ) {

        return
            points[points.length - 1][1];
    }


    ////////////////////////////////////////////////////////////
    // Zwischenpunkte interpolieren
    ////////////////////////////////////////////////////////////

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const p1 = points[i];

        const p2 = points[i + 1];


        if (
            speed >= p1[0] &&
            speed <= p2[0]
        ) {

            const ratio =
                (speed - p1[0]) /
                (p2[0] - p1[0]);


            return
                p1[1] +
                (
                    p2[1] -
                    p1[1]
                ) *
                ratio;
        }
    }


    return 750;
}


////////////////////////////////////////////////////////////
// ENGINE MODEL
////////////////////////////////////////////////////////////

function updateEngineModel() {

    const speed =
        currentSpeed;


    ////////////////////////////////////////////////////////////
    // Geschwindigkeit ändern
    ////////////////////////////////////////////////////////////

    const delta =
        speed -
        previousSpeed;


    previousSpeed =
        speed;


    ////////////////////////////////////////////////////////////
    // RPM
    ////////////////////////////////////////////////////////////

    let rpm =
        calculateRPM(speed);


    ////////////////////////////////////////////////////////////
    // Virtuelles Gas
    //
    // Schnelles Beschleunigen =
    // deutlich mehr Motorlast
    ////////////////////////////////////////////////////////////

    let accelerationLoad =
        Math.abs(delta) / 8;


    ////////////////////////////////////////////////////////////
    // Grundlast
    ////////////////////////////////////////////////////////////

    let load =
        0.05 +
        speed / 650;


    ////////////////////////////////////////////////////////////
    // Beschleunigung
    ////////////////////////////////////////////////////////////

    if (delta > 0) {

        load +=
            Math.min(
                0.7,
                accelerationLoad
            );

        rpm +=
            Math.min(
                500,
                delta * 15
            );
    }


    ////////////////////////////////////////////////////////////
    // Abbremsen
    ////////////////////////////////////////////////////////////

    if (delta < 0) {

        rpm -=
            Math.min(
                300,
                Math.abs(delta) * 8
            );

        load *= 0.65;
    }


    ////////////////////////////////////////////////////////////
    // Leerlauf
    ////////////////////////////////////////////////////////////

    if (speed < 2) {

        rpm =
            750;

        load =
            0.05;
    }


    ////////////////////////////////////////////////////////////
    // Begrenzen
    ////////////////////////////////////////////////////////////

    rpm =
        Math.max(
            700,
            Math.min(
                6200,
                rpm
            )
        );


    load =
        Math.max(
            0.03,
            Math.min(
                1,
                load
            )
        );


    targetRPM =
        rpm;

    targetLoad =
        load;


    ////////////////////////////////////////////////////////////
    // Anzeige
    ////////////////////////////////////////////////////////////

    document.getElementById(
        "speedValue"
    ).textContent =
        Math.round(speed);

}


////////////////////////////////////////////////////////////
// AUDIO START
////////////////////////////////////////////////////////////

function startEngine() {

    if (engineRunning) {
        return;
    }


    ////////////////////////////////////////////////////////////
    // CONTEXT
    ////////////////////////////////////////////////////////////

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    ////////////////////////////////////////////////////////////
    // MASTER
    ////////////////////////////////////////////////////////////

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0;

    masterGain.connect(
        audioContext.destination
    );


    ////////////////////////////////////////////////////////////
    // RUMBLE
    ////////////////////////////////////////////////////////////

    rumbleGain =
        audioContext.createGain();

    rumbleGain.gain.value =
        0.5;

    rumbleGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // EXHAUST
    ////////////////////////////////////////////////////////////

    exhaustGain =
        audioContext.createGain();

    exhaustGain.gain.value =
        0.5;

    exhaustGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // AGGRESSIVE
    ////////////////////////////////////////////////////////////

    aggressiveGain =
        audioContext.createGain();

    aggressiveGain.gain.value =
        0;

    aggressiveGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////////

    filter =
        audioContext.createBiquadFilter();

    filter.type =
        "lowpass";

    filter.frequency.value =
        400;

    filter.Q.value =
        1.3;

    filter.connect(
        exhaustGain
    );


    ////////////////////////////////////////////////////////////
    // OSCILLATORS
    ////////////////////////////////////////////////////////////

    oscillator1 =
        createOscillator(
            "sawtooth",
            rumbleGain
        );


    oscillator2 =
        createOscillator(
            "square",
            filter
        );


    oscillator3 =
        createOscillator(
            "sawtooth",
            filter
        );


    oscillator4 =
        createOscillator(
            "triangle",
            aggressiveGain
        );


    ////////////////////////////////////////////////////////////
    // START
    ////////////////////////////////////////////////////////////

    engineRunning =
        true;


    document
        .getElementById(
            "engineLight"
        )
        .classList.add(
            "running"
        );


    document
        .getElementById(
            "statusText"
        )
        .textContent =
        "V8 läuft";


    audioContext.resume();


    engineAudioLoop();
}


////////////////////////////////////////////////////////////
// CREATE OSCILLATOR
////////////////////////////////////////////////////////////

function createOscillator(
    type,
    destination
) {

    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    gain.gain.value =
        0;


    oscillator.connect(
        gain
    );


    gain.connect(
        destination
    );


    oscillator.start();


    oscillator._gain =
        gain;


    return oscillator;
}


////////////////////////////////////////////////////////////
// AUDIO ENGINE LOOP
////////////////////////////////////////////////////////////

function engineAudioLoop() {

    if (!engineRunning) {
        return;
    }


    ////////////////////////////////////////////////////////////
    // SMOOTH RPM
    ////////////////////////////////////////////////////////////

    currentRPM +=
        (
            targetRPM -
            currentRPM
        ) *
        0.08;


    ////////////////////////////////////////////////////////////
    // SMOOTH LOAD
    ////////////////////////////////////////////////////////////

    currentLoad +=
        (
            targetLoad -
            currentLoad
        ) *
        0.06;


    ////////////////////////////////////////////////////////////
    // V8 FIRING FREQUENCY
    ////////////////////////////////////////////////////////////

    const firingFrequency =
        currentRPM / 15;


    ////////////////////////////////////////////////////////////
    // UNREGELMÄSSIGER LEERLAUF
    ////////////////////////////////////////////////////////////

    let idleFactor =
        0;


    if (currentRPM < 1400) {

        idleFactor =
            1 -
            (
                (currentRPM - 700) /
                700
            );

        idleFactor =
            Math.max(
                0,
                Math.min(
                    1,
                    idleFactor
                )
            );
    }


    ////////////////////////////////////////////////////////////
    // LOW RPM "BLOP"
    ////////////////////////////////////////////////////////////

    const time =
        performance.now() / 1000;


    const lumpyIdle =

        Math.sin(time * 7.1) *

        Math.sin(time * 3.17) *

        idleFactor;


    ////////////////////////////////////////////////////////////
    // OSC 1
    // Tiefer Motorblock
    ////////////////////////////////////////////////////////////

    oscillator1.frequency.setTargetAtTime(

        firingFrequency * 0.5,

        audioContext.currentTime,

        0.03
    );


    oscillator1._gain.gain.setTargetAtTime(

        0.12 +
        currentLoad * 0.18 +
        lumpyIdle * 0.025,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // OSC 2
    // Auspuff
    ////////////////////////////////////////////////////////////

    oscillator2.frequency.setTargetAtTime(

        firingFrequency,

        audioContext.currentTime,

        0.03
    );


    oscillator2._gain.gain.setTargetAtTime(

        0.06 +
        currentLoad * 0.22 +
        idleFactor * 0.035,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // OSC 3
    // V8 HARMONICS
    ////////////////////////////////////////////////////////////

    oscillator3.frequency.setTargetAtTime(

        firingFrequency * 2,

        audioContext.currentTime,

        0.03
    );


    oscillator3._gain.gain.setTargetAtTime(

        0.015 +
        currentLoad * 0.10,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // OSC 4
    // HOHE LAST / AGGRESSIV
    ////////////////////////////////////////////////////////////

    oscillator4.frequency.setTargetAtTime(

        firingFrequency * 3,

        audioContext.currentTime,

        0.03
    );


    oscillator4._gain.gain.setTargetAtTime(

        currentLoad *
        0.08,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////////

    const filterFrequency =

        250 +

        currentRPM * 0.25 +

        currentLoad * 2500;


    filter.frequency.setTargetAtTime(

        Math.min(
            6500,
            filterFrequency
        ),

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////////
    // MASTER VOLUME
    ////////////////////////////////////////////////////////////

    let volume =

        0.28 +

        currentLoad * 0.45;


    ////////////////////////////////////////////////////////////
    // STAND
    ////////////////////////////////////////////////////////////

    if (currentRPM < 1000) {

        volume *= 0.8;
    }


    masterGain.gain.setTargetAtTime(

        volume,

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////////
    // DISPLAY
    ////////////////////////////////////////////////////////////

    document.getElementById(
        "rpmValue"
    ).textContent =
        Math.round(currentRPM);


    document.getElementById(
        "loadValue"
    ).textContent =
        Math.round(
            currentLoad * 100
        );


    ////////////////////////////////////////////////////////////
    // LOOP
    ////////////////////////////////////////////////////////////

    setTimeout(
        engineAudioLoop,
        25
    );
}


////////////////////////////////////////////////////////////
// START BUTTON
////////////////////////////////////////////////////////////

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        function() {

            startEngine();

        }
    );


////////////////////////////////////////////////////////////
// INITIAL STATE
////////////////////////////////////////////////////////////

updateEngineModel();

</script>

</body>
</html>
