<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old American V8</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.panel {
    background: #1d1d1d;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
}

.mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.mode-button {
    padding: 16px;
    border: 2px solid #444;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.mode-button.active {
    background: #b71c1c;
    border-color: #e53935;
}

.speed-display {
    text-align: center;
    margin: 15px 0 25px;
}

.speed-number {
    font-size: 60px;
    font-weight: bold;
}

.speed-unit {
    color: #999;
    font-size: 20px;
}

#speedSlider {
    display: block;
    width: 100%;
    height: 45px;
    margin: 10px 0;
    accent-color: #e53935;
    cursor: pointer;
}

.range-labels {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 13px;
}

.data {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.data-box {
    background: #292929;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.label {
    color: #888;
    font-size: 13px;
    margin-bottom: 5px;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.start-button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #c62828;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    text-align: center;
    margin-top: 15px;
    color: #aaa;
}

.engine-light {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #555;
    margin-right: 7px;
}

.engine-light.running {
    background: #ff3b30;
    box-shadow: 0 0 12px #ff3b30;
}

.gps-info {
    text-align: center;
    color: #aaa;
    margin-top: 15px;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>🇺🇸 Old American V8</h1>

<div class="subtitle">
    V8 Sound Simulator
</div>


<!-- MODE -->

<div class="panel">

    <div style="text-align:center;color:#aaa;margin-bottom:15px;">
        GESCHWINDIGKEIT
    </div>

    <div class="mode-buttons">

        <button
            id="simulationButton"
            class="mode-button active">
            🎚️ SCHIEBEREGLER
        </button>

        <button
            id="gpsButton"
            class="mode-button">
            🛰️ GPS
        </button>

    </div>

</div>


<!-- SPEED -->

<div class="panel">

    <div class="speed-display">

        <div class="speed-number">
            <span id="speedValue">0</span>
        </div>

        <div class="speed-unit">
            km/h
        </div>

    </div>


    <div id="simulationControl">

        <input
            id="speedSlider"
            type="range"
            min="0"
            max="200"
            step="1"
            value="0"
        >

        <div class="range-labels">
            <span>0</span>
            <span>50</span>
            <span>100</span>
            <span>150</span>
            <span>200</span>
        </div>

    </div>


    <div
        id="gpsInfo"
        class="gps-info hidden">

        GPS Geschwindigkeit:
        <span id="gpsSpeed">0</span> km/h

        <br>

        Genauigkeit:
        <span id="gpsAccuracy">---</span> m

    </div>

</div>


<!-- MOTOR -->

<div class="panel">

    <div class="data">

        <div class="data-box">

            <div class="label">
                DREHZAHL
            </div>

            <div class="value">
                <span id="rpmValue">750</span>
                <span style="font-size:13px;color:#777;">
                    RPM
                </span>
            </div>

        </div>


        <div class="data-box">

            <div class="label">
                MOTORLAST
            </div>

            <div class="value">
                <span id="loadValue">5</span>
                <span style="font-size:13px;color:#777;">
                    %
                </span>
            </div>

        </div>

    </div>

</div>


<!-- START -->

<div class="panel">

    <button
        id="startButton"
        class="start-button">

        🔊 V8 STARTEN

    </button>


    <div class="status">

        <span
            id="engineLight"
            class="engine-light">
        </span>

        <span id="statusText">
            Motor aus
        </span>

    </div>

</div>

</div>


<script>

////////////////////////////////////////////////////////////
// MODE
////////////////////////////////////////////////////////////

let mode = "simulation";


////////////////////////////////////////////////////////////
// SPEED
////////////////////////////////////////////////////////////

let requestedSpeed = 0;

let actualSpeed = 0;

let gpsSpeed = 0;

let previousActualSpeed = 0;

let speedAcceleration = 0;


////////////////////////////////////////////////////////////
// ENGINE
////////////////////////////////////////////////////////////

let targetRPM = 750;

let currentRPM = 750;

let targetLoad = 0.05;

let currentLoad = 0.05;


////////////////////////////////////////////////////////////
// AUDIO
////////////////////////////////////////////////////////////

let audioContext = null;

let masterGain = null;

let rumbleGain = null;

let exhaustGain = null;

let aggressiveGain = null;

let filter = null;

let osc1 = null;

let osc2 = null;

let osc3 = null;

let osc4 = null;

let engineRunning = false;


////////////////////////////////////////////////////////////
// ELEMENTS
////////////////////////////////////////////////////////////

const slider =
    document.getElementById(
        "speedSlider"
    );

const simulationButton =
    document.getElementById(
        "simulationButton"
    );

const gpsButton =
    document.getElementById(
        "gpsButton"
    );

const simulationControl =
    document.getElementById(
        "simulationControl"
    );

const gpsInfo =
    document.getElementById(
        "gpsInfo"
    );


////////////////////////////////////////////////////////////
// SLIDER
////////////////////////////////////////////////////////////

slider.addEventListener(
    "input",
    function() {

        requestedSpeed =
            Number(slider.value);

    }
);


////////////////////////////////////////////////////////////
// SIMULATION BUTTON
////////////////////////////////////////////////////////////

simulationButton.addEventListener(
    "click",
    function() {

        mode = "simulation";

        simulationButton.classList.add(
            "active"
        );

        gpsButton.classList.remove(
            "active"
        );

        simulationControl.classList.remove(
            "hidden"
        );

        gpsInfo.classList.add(
            "hidden"
        );

        requestedSpeed =
            Number(slider.value);

    }
);


////////////////////////////////////////////////////////////
// GPS BUTTON
////////////////////////////////////////////////////////////

gpsButton.addEventListener(
    "click",
    function() {

        mode = "gps";

        gpsButton.classList.add(
            "active"
        );

        simulationButton.classList.remove(
            "active"
        );

        simulationControl.classList.add(
            "hidden"
        );

        gpsInfo.classList.remove(
            "hidden"
        );

        startGPS();

    }
);


////////////////////////////////////////////////////////////
// GPS
////////////////////////////////////////////////////////////

let gpsStarted = false;

function startGPS() {

    if (gpsStarted) {
        return;
    }

    if (!navigator.geolocation) {

        document.getElementById(
            "statusText"
        ).textContent =
            "GPS nicht verfügbar";

        return;
    }

    gpsStarted = true;


    navigator.geolocation.watchPosition(

        function(position) {

            let speed =
                position.coords.speed;


            if (
                speed === null ||
                isNaN(speed)
            ) {

                speed = 0;

            }


            gpsSpeed =
                Math.max(
                    0,
                    speed * 3.6
                );


            document.getElementById(
                "gpsSpeed"
            ).textContent =
                gpsSpeed.toFixed(1);


            document.getElementById(
                "gpsAccuracy"
            ).textContent =
                position.coords.accuracy
                    ? position.coords.accuracy.toFixed(0)
                    : "---";

        },

        function(error) {

            document.getElementById(
                "statusText"
            ).textContent =
                "GPS Fehler: " +
                error.message;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 500,
            timeout: 10000
        }

    );
}


////////////////////////////////////////////////////////////
// REALISTISCHE RPM KURVE
////////////////////////////////////////////////////////////

function calculateRPM(speed) {

    const points = [

        [0,   750],
        [5,   800],
        [10,  950],
        [20,  1200],
        [30,  1500],
        [40,  1750],
        [60,  2250],
        [80,  2800],
        [100, 3350],
        [120, 3900],
        [150, 4700],
        [180, 5400],
        [200, 6000]

    ];


    if (speed <= 0) {

        return 750;

    }


    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const a =
            points[i];

        const b =
            points[i + 1];


        if (
            speed >= a[0] &&
            speed <= b[0]
        ) {

            const t =
                (speed - a[0]) /
                (b[0] - a[0]);


            return (
                a[1] +
                (b[1] - a[1]) * t
            );

        }

    }


    return 6000;
}


////////////////////////////////////////////////////////////
// MOTOR MODEL
////////////////////////////////////////////////////////////

function updateEngineModel() {

    ////////////////////////////////////////////////////////////
    // Geschwindigkeit auswählen
    ////////////////////////////////////////////////////////////

    let desiredSpeed;

    if (mode === "simulation") {

        desiredSpeed =
            requestedSpeed;

    } else {

        desiredSpeed =
            gpsSpeed;

    }


    ////////////////////////////////////////////////////////////
    // Geschwindigkeit folgt Zielwert
    ////////////////////////////////////////////////////////////

    actualSpeed +=
        (
            desiredSpeed -
            actualSpeed
        ) * 0.18;


    ////////////////////////////////////////////////////////////
    // Beschleunigung
    ////////////////////////////////////////////////////////////

    speedAcceleration =
        actualSpeed -
        previousActualSpeed;


    previousActualSpeed =
        actualSpeed;


    ////////////////////////////////////////////////////////////
    // RPM
    ////////////////////////////////////////////////////////////

    let rpm =
        calculateRPM(actualSpeed);


    ////////////////////////////////////////////////////////////
    // SCHNELLER GASWECHSEL
    ////////////////////////////////////////////////////////////

    if (speedAcceleration > 0.15) {

        rpm +=
            Math.min(
                450,
                speedAcceleration * 120
            );

    }


    ////////////////////////////////////////////////////////////
    // MOTORLAST
    ////////////////////////////////////////////////////////////

    let load;


    if (actualSpeed < 2) {

        load = 0.045;

    } else {

        load =
            0.10 +
            actualSpeed / 600;

    }


    ////////////////////////////////////////////////////////////
    // BESCHLEUNIGEN
    ////////////////////////////////////////////////////////////

    if (speedAcceleration > 0) {

        load +=
            Math.min(
                0.65,
                speedAcceleration * 0.20
            );

    }


    ////////////////////////////////////////////////////////////
    // ABTOUREN
    ////////////////////////////////////////////////////////////

    if (speedAcceleration < -0.2) {

        load *= 0.55;

    }


    ////////////////////////////////////////////////////////////
    // LIMIT
    ////////////////////////////////////////////////////////////

    targetRPM =
        Math.max(
            700,
            Math.min(
                6200,
                rpm
            )
        );


    targetLoad =
        Math.max(
            0.03,
            Math.min(
                1,
                load
            )
        );


    ////////////////////////////////////////////////////////////
    // DISPLAY
    ////////////////////////////////////////////////////////////

    document.getElementById(
        "speedValue"
    ).textContent =
        actualSpeed.toFixed(1);

}


////////////////////////////////////////////////////////////
// AUDIO START
////////////////////////////////////////////////////////////

function startEngine() {

    if (engineRunning) {
        return;
    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    ////////////////////////////////////////////////////////////
    // MASTER
    ////////////////////////////////////////////////////////////

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0;

    masterGain.connect(
        audioContext.destination
    );


    ////////////////////////////////////////////////////////////
    // RUMBLE
    ////////////////////////////////////////////////////////////

    rumbleGain =
        audioContext.createGain();

    rumbleGain.gain.value =
        0.5;

    rumbleGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // EXHAUST
    ////////////////////////////////////////////////////////////

    exhaustGain =
        audioContext.createGain();

    exhaustGain.gain.value =
        0.5;

    exhaustGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // AGGRESSIVE
    ////////////////////////////////////////////////////////////

    aggressiveGain =
        audioContext.createGain();

    aggressiveGain.gain.value =
        0;

    aggressiveGain.connect(
        masterGain
    );


    ////////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////////

    filter =
        audioContext.createBiquadFilter();

    filter.type =
        "lowpass";

    filter.frequency.value =
        400;

    filter.Q.value =
        1.4;

    filter.connect(
        exhaustGain
    );


    ////////////////////////////////////////////////////////////
    // OSCILLATORS
    ////////////////////////////////////////////////////////////

    osc1 =
        createOscillator(
            "sawtooth",
            rumbleGain
        );

    osc2 =
        createOscillator(
            "square",
            filter
        );

    osc3 =
        createOscillator(
            "sawtooth",
            filter
        );

    osc4 =
        createOscillator(
            "triangle",
            aggressiveGain
        );


    engineRunning = true;


    document
        .getElementById(
            "engineLight"
        )
        .classList.add(
            "running"
        );


    document
        .getElementById(
            "statusText"
        )
        .textContent =
        "V8 läuft";


    audioContext.resume();

}


////////////////////////////////////////////////////////////
// OSCILLATOR
////////////////////////////////////////////////////////////

function createOscillator(
    type,
    destination
) {

    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    gain.gain.value =
        0;


    oscillator.connect(
        gain
    );


    gain.connect(
        destination
    );


    oscillator.start();


    oscillator._gain =
        gain;


    return oscillator;
}


////////////////////////////////////////////////////////////
// AUDIO UPDATE
////////////////////////////////////////////////////////////

function updateAudio() {

    if (!engineRunning) {
        return;
    }


    ////////////////////////////////////////////////////////////
    // RPM SMOOTHING
    ////////////////////////////////////////////////////////////

    currentRPM +=
        (
            targetRPM -
            currentRPM
        ) * 0.08;


    ////////////////////////////////////////////////////////////
    // LOAD SMOOTHING
    ////////////////////////////////////////////////////////////

    currentLoad +=
        (
            targetLoad -
            currentLoad
        ) * 0.08;


    ////////////////////////////////////////////////////////////
    // V8 FIRING
    ////////////////////////////////////////////////////////////

    const firingFrequency =
        currentRPM / 15;


    ////////////////////////////////////////////////////////////
    // IDLE
    ////////////////////////////////////////////////////////////

    let idleFactor = 0;


    if (currentRPM < 1400) {

        idleFactor =
            1 -
            (
                (currentRPM - 700) /
                700
            );

        idleFactor =
            Math.max(
                0,
                Math.min(
                    1,
                    idleFactor
                )
            );

    }


    ////////////////////////////////////////////////////////////
    // LUMPY V8
    ////////////////////////////////////////////////////////////

    const t =
        performance.now() / 1000;


    const lumpy =

        Math.sin(t * 7.3) *
        Math.sin(t * 3.11) *
        idleFactor;


    ////////////////////////////////////////////////////////////
    // LOW RUMBLE
    ////////////////////////////////////////////////////////////

    osc1.frequency.setTargetAtTime(

        firingFrequency * 0.5,

        audioContext.currentTime,

        0.03
    );


    osc1._gain.gain.setTargetAtTime(

        0.12 +
        currentLoad * 0.18 +
        lumpy * 0.025,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // EXHAUST
    ////////////////////////////////////////////////////////////

    osc2.frequency.setTargetAtTime(

        firingFrequency,

        audioContext.currentTime,

        0.03
    );


    osc2._gain.gain.setTargetAtTime(

        0.06 +
        currentLoad * 0.22 +
        idleFactor * 0.04,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // HARMONICS
    ////////////////////////////////////////////////////////////

    osc3.frequency.setTargetAtTime(

        firingFrequency * 2,

        audioContext.currentTime,

        0.03
    );


    osc3._gain.gain.setTargetAtTime(

        0.015 +
        currentLoad * 0.10,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // AGGRESSIVE HIGH RPM
    ////////////////////////////////////////////////////////////

    osc4.frequency.setTargetAtTime(

        firingFrequency * 3,

        audioContext.currentTime,

        0.03
    );


    osc4._gain.gain.setTargetAtTime(

        currentLoad * 0.10,

        audioContext.currentTime,

        0.04
    );


    ////////////////////////////////////////////////////////////
    // FILTER
    ////////////////////////////////////////////////////////////

    const filterFrequency =

        250 +
        currentRPM * 0.25 +
        currentLoad * 2500;


    filter.frequency.setTargetAtTime(

        Math.min(
            6500,
            filterFrequency
        ),

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////////
    // VOLUME
    ////////////////////////////////////////////////////////////

    let volume =

        0.25 +
        currentLoad * 0.45;


    if (currentRPM < 1000) {

        volume *= 0.8;

    }


    masterGain.gain.setTargetAtTime(

        volume,

        audioContext.currentTime,

        0.05
    );


    ////////////////////////////////////////////////////////////
    // DISPLAY
    ////////////////////////////////////////////////////////////

    document.getElementById(
        "rpmValue"
    ).textContent =
        Math.round(currentRPM);


    document.getElementById(
        "loadValue"
    ).textContent =
        Math.round(
            currentLoad * 100
        );

}


////////////////////////////////////////////////////////////
// MAIN LOOP
////////////////////////////////////////////////////////////

function mainLoop() {

    updateEngineModel();

    updateAudio();

    requestAnimationFrame(
        mainLoop
    );

}


////////////////////////////////////////////////////////////
// START BUTTON
////////////////////////////////////////////////////////////

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        function() {

            startEngine();

        }
    );


////////////////////////////////////////////////////////////
// START
////////////////////////////////////////////////////////////

mainLoop();

</script>

</body>
</html>
